<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
<title id="title">Engineering Agent Kit workflow</title>
<desc id="desc">In one session: plan, build and check, then save a report artifact. Repeat if needed. An optional feature hub can coordinate linked tasks in a separate session.</desc>
<defs>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.05"/></filter>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
<marker id="bluearrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#60a5fa"/></marker>
</defs>
<rect width="1400" height="720" rx="24" fill="#f8fafc"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="64" y="45" font-size="12" font-weight="700" letter-spacing="2.5" fill="#64748b">ENGINEERING AGENT KIT</text>
<text x="64" y="90" font-size="29" font-weight="700" fill="#0f172a">From a Product Requirements Document (PRD)</text>
<text x="64" y="128" font-size="29" font-weight="700" fill="#0f172a">to tested code</text>
<text x="64" y="159" font-size="16" fill="#64748b">Plan, build, and save the result in one session.</text>
<rect x="64" y="193" width="1272" height="71" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-dasharray="6 5"/>
<text x="88" y="220" font-size="12" font-weight="700" letter-spacing="1.2" fill="#2563eb">OPTIONAL · FEATURE HUB</text>
<text x="88" y="245" font-size="15" fill="#475569">A separate session can track linked tasks, dependencies, and reports <tspan font-weight="700">($feature-hub).</tspan></text>
<path d="M 229 265 V 320" stroke="#60a5fa" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#bluearrow)"/>
<text x="245" y="299" font-size="12" fill="#64748b">Task brief</text>
<text x="700" y="303" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="2" fill="#64748b">MAIN WORKFLOW · ONE SESSION</text>
<rect x="64" y="331" width="330" height="237" rx="17" fill="white" stroke="#e2e8f0" filter="url(#shadow)"/><rect x="65" y="332" width="328" height="76" rx="16" fill="#eff6ff"/><rect x="84" y="351" width="38" height="38" rx="11" fill="#2563eb"/><text x="103" y="376" text-anchor="middle" font-size="16" font-weight="700" fill="white">01</text><text x="136" y="366" font-size="14" font-weight="700" letter-spacing="0.6" fill="#2563eb">PLAN</text><text x="136" y="389" font-size="12" fill="#475569">Understand one task</text><circle cx="96" cy="439" r="3.5" fill="#2563eb" opacity="0.8"/><text x="111" y="445" font-size="15" fill="#334155">Read requirements <tspan font-size="11" fill="#64748b">(analyst)</tspan></text><circle cx="96" cy="483" r="3.5" fill="#2563eb" opacity="0.8"/><text x="111" y="489" font-size="15" fill="#334155">Check code and risks <tspan font-size="11" fill="#64748b">(tech-lead)</tspan></text><circle cx="96" cy="527" r="3.5" fill="#2563eb" opacity="0.8"/><text x="111" y="533" font-size="15" fill="#334155">Prepare a plan <tspan font-size="11" fill="#64748b">($plan-feature)</tspan></text><rect x="535" y="331" width="330" height="237" rx="17" fill="white" stroke="#e2e8f0" filter="url(#shadow)"/><rect x="536" y="332" width="328" height="76" rx="16" fill="#f5f3ff"/><rect x="555" y="351" width="38" height="38" rx="11" fill="#7c3aed"/><text x="574" y="376" text-anchor="middle" font-size="16" font-weight="700" fill="white">02</text><text x="607" y="366" font-size="14" font-weight="700" letter-spacing="0.6" fill="#7c3aed">BUILD &amp; CHECK</text><text x="607" y="389" font-size="12" fill="#475569">Follow the approved plan</text><rect x="551" y="422" width="298" height="35" rx="9" fill="#fffbeb" stroke="#fde68a"/><circle cx="567" cy="439" r="3.5" fill="#d97706" opacity="0.8"/><text x="582" y="445" font-size="15" fill="#92400e">Approve the plan <tspan font-size="11" fill="#92400e">(you)</tspan></text><circle cx="567" cy="483" r="3.5" fill="#7c3aed" opacity="0.8"/><text x="582" y="489" font-size="15" fill="#334155">Write the code <tspan font-size="11" fill="#64748b">(developer)</tspan></text><circle cx="567" cy="527" r="3.5" fill="#7c3aed" opacity="0.8"/><text x="582" y="533" font-size="15" fill="#334155">Tests + review <tspan font-size="10.5" fill="#64748b">(qa, reviewer)</tspan></text><rect x="1006" y="331" width="330" height="237" rx="17" fill="white" stroke="#e2e8f0" filter="url(#shadow)"/><rect x="1007" y="332" width="328" height="76" rx="16" fill="#ecfdf5"/><rect x="1026" y="351" width="38" height="38" rx="11" fill="#059669"/><text x="1045" y="376" text-anchor="middle" font-size="16" font-weight="700" fill="white">03</text><text x="1078" y="366" font-size="14" font-weight="700" letter-spacing="0.6" fill="#059669">SAVE &amp; CONTINUE</text><text x="1078" y="389" font-size="12" fill="#475569">Keep a clear result</text><circle cx="1038" cy="439" r="3.5" fill="#059669" opacity="0.8"/><text x="1053" y="445" font-size="15" fill="#334155">Save report <tspan font-size="11" fill="#64748b">(e.g. Obsidian)</tspan></text><text x="1053" y="465" font-size="15" fill="#64748b"><tspan font-size="11" fill="#64748b">($plan-feature / $verify-feature)</tspan></text><circle cx="1038" cy="499" r="3.5" fill="#059669" opacity="0.8"/><text x="1053" y="505" font-size="15" fill="#334155">Status + next steps <tspan font-size="11" fill="#64748b">(tech-lead)</tspan></text><path d="M 414 449 H 515" fill="none" stroke="#64748b" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M 885 449 H 986" fill="none" stroke="#64748b" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M 1171 568 V 609 Q 1171 635 1145 635 H 255 Q 229 635 229 609 V 578" fill="none" stroke="#64748b" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="576" y="615" width="248" height="39" rx="19.5" fill="#e2e8f0" stroke="#f8fafc" stroke-width="7"/>
<text x="700" y="640" text-anchor="middle" font-size="14" fill="#334155">Repeat if needed</text>
<text x="700" y="686" text-anchor="middle" font-size="13" fill="#64748b">Use the same workflow for the next task or another pass.</text>
<text x="700" y="708" text-anchor="middle" font-size="11" fill="#64748b">Role names show who does the work. $names are skills.</text></g></svg>